# Nightly refresh of the SystemOnTPTP systems snapshot (requirements R10).
#
# 1. Regenerates priv/system_on_tptp/systems.json and SYSTEMS.md.
# 2. When either changed, opens or updates the one long-lived pull request on
#    branch systems/refresh, titled with the delta, its body the SYSTEMS.md diff
#    and the audit output.
# 3. Runs the audit with --strict; the job fails when anything requires action,
#    and the failure is the flag. The pull request is opened first, so the data
#    lands and the failure stays visible on the run.
#
# The audit is silenced only by an entry in priv/system_on_tptp/overrides.json.
name: systems

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: systems-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
      BRANCH: systems/refresh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get

      - name: Keep the previous snapshot
        run: cp priv/system_on_tptp/systems.json "$RUNNER_TEMP/previous.json"

      - name: Refresh
        run: mix atp_client.systems.refresh --delta-file "$RUNNER_TEMP/delta.txt"

      - name: Audit
        id: audit
        run: |
          set +e
          mix atp_client.systems.audit --strict --previous "$RUNNER_TEMP/previous.json" \
            > "$RUNNER_TEMP/audit.txt" 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/audit.txt"

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- priv/system_on_tptp/systems.json priv/system_on_tptp/SYSTEMS.md; then
            echo "snapshot unchanged"
            exit 0
          fi

          # generated_at changes on every run; a change to it alone is no news.
          changed="$(git diff -U0 -- priv/system_on_tptp/systems.json priv/system_on_tptp/SYSTEMS.md \
            | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' | grep -cvE 'generated_at|^[+-]Generated by' || true)"
          if [ "$changed" -eq 0 ]; then
            echo "only the timestamp changed"
            exit 0
          fi

          title="$(cat "$RUNNER_TEMP/delta.txt")"
          {
            echo "Nightly refresh of the SystemOnTPTP systems snapshot."
            echo
            echo '## SYSTEMS.md'
            echo
            echo '```diff'
            git diff -- priv/system_on_tptp/SYSTEMS.md
            echo '```'
            echo
            echo '## Audit'
            echo
            echo '```'
            cat "$RUNNER_TEMP/audit.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add priv/system_on_tptp/systems.json priv/system_on_tptp/SYSTEMS.md
          git commit -m "$title"
          git push --force origin "$BRANCH"

          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" \
              --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Fail when the audit found something
        if: steps.audit.outputs.status != '0'
        run: |
          echo "::error::the systems audit requires action; see the Audit step"
          exit 1
